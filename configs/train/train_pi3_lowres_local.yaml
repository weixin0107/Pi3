# @package _global_

trainer: trainers.pi3_trainer.Pi3Trainer

train:
    image_num_range: [2, 24]
    max_img_per_gpu: 64
    resolution:
        - [224, 224]

    num_workers: 2
    num_epoch: 1
    iters_per_epoch: 300
    print_freq: 1
    pointcloud_export:
        enabled: true
        output_dir: /mnt/data/wangzhixing/tmp/pi3_local_gt
        max_sequences: 1

test:
    num_workers: 2
    iters_per_test: 2
    print_freq: 1

log:
    ckpt_interval: 1
    max_checkpoints: 1

model:
    encoder_size: large
    decoder_size: large
    load_vggt: true
    freeze_encoder: true
    ckpt: null
